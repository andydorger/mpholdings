/* Layout: a quiet clubhouse page. Centered crest masthead, two framed entrances on the landing page, hairline brass rules, wide-tracked capitals. */
:root {
  --paper: #f8f7f3;
  --paper-2: #efede6;
  --ink: #0f213a;
  --ink-soft: #3c4a5e;
  --muted: #6b7584;
  --brass: #9b7d4e;
  --gold: #b8955a;
  --rule: #d9d4c7;
  --crest: #0f213a;
  --danger: #8a2a2a;
  --ok: #2f6b4a; --ok-bg: #e3eee6; --warn: #8a6216; --warn-bg: #f4ead3; --bad: #9a2f2f; --bad-bg: #f5e1de;
  --display: "Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
  --text: "EB Garamond", Garamond, Georgia, "Times New Roman", serif;
  --measure: 36rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0c1829; --paper-2: #122238; --ink: #ece8dd; --ink-soft: #c5c3ba;
    --muted: #8f97a3; --brass: #c4a571; --gold: #c9a868; --rule: #2a3a52; --crest: #ece8dd; --danger: #e09a8f; --ok: #8fcaa6; --ok-bg: #173527; --warn: #e2bf7a; --warn-bg: #3a2f17; --bad: #ec9e94; --bad-bg: #3d1f1f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0c1829; --paper-2: #122238; --ink: #ece8dd; --ink-soft: #c5c3ba;
  --muted: #8f97a3; --brass: #c4a571; --gold: #c9a868; --rule: #2a3a52; --crest: #ece8dd; --danger: #e09a8f; --ok: #8fcaa6; --ok-bg: #173527; --warn: #e2bf7a; --warn-bg: #3a2f17; --bad: #ec9e94; --bad-bg: #3d1f1f; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--text);
  font-size: 1.1875rem;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.wrap {
  max-width: 64rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Masthead */
.masthead { border-bottom: 1px solid var(--rule); }
.masthead .wrap { display: grid; justify-items: center; gap: 1.1rem; padding-block: 2rem 1.25rem; }
.brand { display: grid; justify-items: center; gap: .6rem; color: inherit; text-decoration: none; }
.brand .crest { width: 2.6rem; }
.brand .mp-mark { width: 5.5rem; }
.entrance.plain { grid-template-rows: auto auto auto; align-items: center; padding-block: 2.5rem 2.25rem; }
.entrance.plain .lede { color: var(--ink-soft); font-size: 1.05rem; max-width: 18rem; }
.wordmark {
  font-family: var(--display);
  font-weight: 500;
  font-size: 1.5rem;
  letter-spacing: .42em;
  margin-right: -.42em; /* optical centering for tracked caps */
  line-height: 1;
}
nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: .25rem 2.25rem; }
nav a {
  font-family: var(--display);
  font-size: .9rem;
  font-weight: 600;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--ink-soft);
  text-decoration: none;
  padding-block: .35rem;
  border-bottom: 1px solid transparent;
  transition: color .2s, border-color .2s;
}
nav a:hover { color: var(--ink); border-bottom-color: var(--rule); }
nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--brass); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }

/* Shared type */
main { padding-block: 4rem 5rem; }
.eyebrow {
  font-family: var(--display);
  font-size: .85rem;
  font-weight: 600;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--brass);
  margin: 0 0 1rem;
}
h1, h2, h3 { font-family: var(--display); font-weight: 500; text-wrap: balance; margin: 0; color: var(--ink); }
h1 { font-size: clamp(2.4rem, 5.5vw, 3.6rem); line-height: 1.08; letter-spacing: .005em; }
h2 { font-size: clamp(1.6rem, 3.2vw, 2.1rem); line-height: 1.15; }
h3 { font-size: 1.4rem; line-height: 1.2; }
p { margin: 0; }
.prose { max-width: var(--measure); margin-inline: auto; display: grid; gap: 1.25rem; color: var(--ink-soft); }
.prose .lede { font-size: 1.35rem; line-height: 1.55; color: var(--ink); }
.page-head { text-align: center; display: grid; justify-items: center; gap: .25rem; margin-bottom: 3rem; }
.ornament { display: flex; align-items: center; justify-content: center; gap: .9rem; color: var(--brass); margin-block: 2.75rem; }
.ornament::before, .ornament::after { content: ""; height: 1px; width: 4.5rem; background: var(--rule); }
.ornament span { width: 6px; height: 6px; transform: rotate(45deg); border: 1px solid currentColor; }

.button {
  display: inline-block;
  font-family: var(--display);
  font-size: .9rem;
  font-weight: 600;
  letter-spacing: .22em;
  text-transform: uppercase;
  text-decoration: none;
  text-align: center;
  color: var(--ink);
  border: 1px solid var(--ink);
  background: transparent;
  padding: .85rem 1.6rem .8rem;
  cursor: pointer;
  transition: background .25s, color .25s;
}
.button:hover { background: var(--ink); color: var(--paper); }
.button[disabled] { opacity: .6; cursor: progress; }
.link {
  font-family: var(--display); font-size: .85rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
  color: var(--ink-soft); text-decoration: none; background: none; border: 0; padding: .25rem 0; cursor: pointer;
  border-bottom: 1px solid var(--rule);
}
.link:hover { color: var(--ink); border-bottom-color: var(--brass); }

/* Landing: two entrances */
.landing-head { text-align: center; display: grid; justify-items: center; gap: .9rem; margin-bottom: 3rem; }
.landing-head .motto { font-style: italic; font-size: 1.3rem; color: var(--ink-soft); max-width: 30rem; }
.entrances { max-width: 52rem; margin: 0 auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2rem; }
.entrance {
  display: grid;
  grid-template-rows: 11rem auto auto auto;
  justify-items: center;
  align-items: end;
  gap: 1.1rem;
  text-align: center;
  padding: 2.75rem 1.5rem 2.25rem;
  border: 1px solid var(--rule);
  outline: 1px solid var(--rule);
  outline-offset: -8px;
  color: inherit;
  text-decoration: none;
  transition: border-color .25s, outline-color .25s, background .25s;
}
.entrance:hover { border-color: var(--brass); outline-color: var(--brass); background: var(--paper-2); }
.entrance:focus-visible { outline: 2px solid var(--brass); outline-offset: -8px; }
.entrance .crest { height: 10.5rem; width: auto; }
.entrance .mp-mark { width: 15rem; }
.entrance .name { font-family: var(--display); font-weight: 500; font-size: 1.7rem; letter-spacing: .3em; margin-right: -.3em; line-height: 1.1; }
.entrance .eyebrow { margin: 0; color: var(--muted); }
.entrance .go { font-family: var(--display); font-size: .85rem; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--ink); border: 1px solid var(--ink); padding: .7rem 1.4rem .65rem; margin-top: .4rem; transition: background .25s, color .25s; }
.entrance:hover .go { background: var(--ink); color: var(--paper); }

/* Login */
.login { max-width: 26rem; margin: 0 auto; display: grid; gap: 2rem; }
.login-head { display: grid; justify-items: center; gap: 1rem; text-align: center; }
.login-head .crest { height: 6.5rem; width: auto; }
.login-head .mp-mark { width: 10rem; }
.login-head .name { font-family: var(--display); font-weight: 500; font-size: 1.35rem; letter-spacing: .3em; margin-right: -.3em; line-height: 1.1; }
form { display: grid; gap: 1.4rem; padding: 2rem 1.75rem; border-top: 1px solid var(--brass); background: var(--paper-2); }
.field { display: grid; gap: .35rem; }
.field label { font-family: var(--display); font-size: .8rem; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-soft); }
.field input {
  font: inherit; font-size: 1.1rem; color: var(--ink); background: transparent;
  border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; padding: .45rem 0; width: 100%;
}
.field input:focus { border-color: var(--ink); outline: none; }
.form-error { color: var(--danger); font-size: 1rem; font-style: italic; }
.form-error:empty { display: none; }
form .button { width: 100%; }
.login-foot { text-align: center; }

/* Portal (content arrives decrypted) */
.portal-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; padding-bottom: 1.25rem; margin-bottom: 3rem; border-bottom: 1px solid var(--rule); }
.portal-bar .who { display: flex; align-items: center; gap: .9rem; min-width: 0; }
.portal-bar .crest { height: 2.6rem; width: auto; }
.portal-bar .mp-mark { width: 4.5rem; }
.portal-bar .name { font-family: var(--display); font-weight: 600; font-size: .9rem; letter-spacing: .24em; text-transform: uppercase; }
.portal { display: grid; gap: 3rem; }
.portal .intro { max-width: var(--measure); display: grid; gap: .9rem; }
.portal .intro p { color: var(--ink-soft); }
.portal .sections { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.25rem 3rem; }
.portal section { display: grid; gap: .75rem; align-content: start; padding-top: 1.1rem; border-top: 1px solid var(--ink); }
.portal section h3 { font-size: 1.3rem; }
.portal .empty { color: var(--muted); font-style: italic; font-size: 1rem; }
.portal ul { margin: 0; padding: 0; list-style: none; display: grid; gap: .5rem; }
.portal li a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; }
.portal li a:hover { text-decoration-color: var(--brass); }

/* Portfolio (MP Holdings) */
.portal .sample-note { font-style: italic; color: var(--warn); font-size: 1rem; }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); }
.tiles div { display: grid; gap: .35rem; align-content: start; padding: 1.1rem 1rem 1.2rem; min-width: 0; }
.tiles div + div { border-left: 1px solid var(--rule); }
.tiles > div > span { font-family: var(--display); font-size: .72rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.tiles strong { font-family: var(--display); font-weight: 500; font-size: clamp(1.35rem, 2.4vw, 1.75rem); line-height: 1.1; font-variant-numeric: lining-nums tabular-nums; overflow-wrap: anywhere; }
.tiles small { font-size: .9rem; color: var(--muted); }
.panel .subhead { font-family: var(--display); font-size: .95rem; font-weight: 600; color: var(--ink); margin-top: 1rem; }
.portal .footnote { font-size: .88rem; font-style: italic; color: var(--muted); margin-top: -.25rem; }
.tiles em { font-style: italic; font-size: .92rem; color: var(--brass); line-height: 1.3; }
.tiles .key { background: var(--paper-2); }
.tiles .key > span { color: var(--brass); }
.block { display: grid; gap: 1.1rem; }
.block > h3 { font-size: 1.5rem; }
.scroll { overflow-x: auto; }
.portal table { width: 100%; border-collapse: collapse; font-size: 1rem; font-variant-numeric: lining-nums tabular-nums; }
.portal th { font-family: var(--display); font-size: .72rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--ink); white-space: nowrap; }
.portal td { padding: .65rem .75rem; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.portal td:first-child, .portal th:first-child { padding-left: 0; }
.portal td:last-child, .portal th:last-child { padding-right: 0; }
.portal .num { text-align: right; }
.portal tfoot td { border-bottom: 0; border-top: 1px solid var(--ink); font-weight: 500; color: var(--ink); }
.portal .strong { font-weight: 500; color: var(--ink); }
.portal .neg { color: var(--bad); }
.portal .na { color: var(--muted); }
.ledger-table td { color: var(--ink-soft); }
.maint td:nth-child(2) { white-space: normal; min-width: 12rem; }

.properties { display: grid; border-top: 1px solid var(--ink); }
.property { border-bottom: 1px solid var(--rule); }
.property summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1.15rem 0; }
.property summary::-webkit-details-marker { display: none; }
.property summary::before { content: ""; flex: none; width: 7px; height: 7px; border-right: 1px solid var(--brass); border-bottom: 1px solid var(--brass); transform: rotate(-45deg); transition: transform .2s; margin-right: .25rem; }
.property[open] summary::before { transform: rotate(45deg); }
.property summary:hover strong { text-decoration: underline; text-decoration-color: var(--brass); text-underline-offset: 5px; }
.property summary:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.p-name { display: grid; gap: .1rem; flex: 1; min-width: 0; }
.p-name strong { font-family: var(--display); font-weight: 500; font-size: 1.4rem; line-height: 1.2; }
.p-name span { color: var(--muted); font-size: 1rem; }
.p-flow { display: grid; justify-items: end; gap: .1rem; font-size: 1.15rem; font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
.p-flow > span:first-child { font-family: var(--display); font-size: .7rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.p-body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2rem 3rem; padding: .5rem 0 2.25rem 1.6rem; }
.panel { display: grid; gap: .6rem; align-content: start; min-width: 0; }
.panel.wide { grid-column: 1 / -1; }
.panel h4 { font-family: var(--display); font-size: .78rem; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--brass); margin: 0; }
.facts { margin: 0; display: grid; }
.facts div { display: flex; justify-content: space-between; gap: 1rem; padding: .4rem 0; border-bottom: 1px dotted var(--rule); font-size: 1rem; }
.facts dt { color: var(--ink-soft); }
.facts dd { margin: 0; text-align: right; color: var(--ink); font-variant-numeric: lining-nums tabular-nums; }
.facts .sub { color: var(--muted); }
.facts a.ext { color: var(--ink); text-decoration: underline; text-decoration-color: var(--brass); text-underline-offset: 4px; }
.facts a.ext:hover { color: var(--brass); }
.facts .total { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); margin-top: .2rem; }
.facts .total dt, .facts .total dd { font-weight: 500; color: var(--ink); }
.months { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .5rem; }
.months li { display: grid; gap: .35rem; justify-items: center; text-align: center; padding: .7rem .25rem; border: 1px solid var(--rule); }
.months .m { font-family: var(--display); font-size: .78rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.unit-pay { display: grid; gap: .45rem; }
.unit-pay + .unit-pay { margin-top: .6rem; }
.unit-label { font-family: var(--display); font-weight: 600; font-size: 1.05rem; color: var(--ink); }
.chip { font-size: .85rem; padding: .1rem .55rem; border-radius: 999px; white-space: nowrap; }
.chip.paid { color: var(--ok); background: var(--ok-bg); }
.chip.late { color: var(--warn); background: var(--warn-bg); }
.chip.due { color: var(--ink-soft); background: var(--paper-2); }
.chip.unpaid { color: var(--bad); background: var(--bad-bg); font-weight: 500; }

/* Tenant portal */
.tenant-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.5rem 3rem; }
.pay-card { grid-row: span 2; display: grid; gap: .9rem; align-content: start; padding: 1.75rem; background: var(--paper-2); border-top: 1px solid var(--brass); }
.pay-card h3 { font-size: 1.5rem; }
.pay-card .due { color: var(--ink-soft); }
.pay-card .due strong { display: block; font-family: var(--display); font-weight: 500; font-size: 2.6rem; line-height: 1.1; color: var(--ink); font-variant-numeric: lining-nums; }
.pay-card .venmo { justify-self: start; margin-top: .4rem; }
.pay-card .handle { font-size: 1rem; color: var(--ink-soft); user-select: all; }
.pay-card .note { font-size: .95rem; color: var(--muted); font-style: italic; }
.tenant .panel p { color: var(--ink-soft); font-size: 1rem; }
.contacts { list-style: none; margin: .4rem 0 0; padding: 0; display: grid; gap: 1rem; }
.contacts li { display: grid; gap: .1rem; font-size: 1rem; }
.contacts strong { font-weight: 500; color: var(--ink); }
.contacts a { color: var(--ink-soft); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; overflow-wrap: anywhere; }
.contacts a:hover { text-decoration-color: var(--brass); }

/* ---------- MP Holdings colour: the logo's navy and gold ---------- */
.site-mp {
  --band: #14294a; --band-2: #0e1f3a; --band-ink: #f3eee2; --band-muted: #aeb6c4;
  --gold-btn: #c49a52; --cream: #f2ecdf;
}
.site-mp body, body.site-mp { background: var(--paper); }
.site-mp .masthead { background: var(--band); border-bottom: 3px solid var(--gold-btn); }
.site-mp .masthead .wrap { padding-block: 1.75rem 1.5rem; }
.site-mp .brand, .site-mp .wordmark { color: var(--band-ink); }
.site-mp .masthead .mp-mark::before { background: var(--band-ink); }
.site-mp .masthead .mp-mark::after { background: var(--gold-btn); }
.site-mp main { padding-block-start: 0; }
.site-mp .landing-head {
  margin-inline: calc(50% - 50vw); padding: 3rem max(16px, env(safe-area-inset-left, 0px)) 3.25rem;
  background: linear-gradient(180deg, var(--band-2), var(--band)); margin-bottom: 3.5rem;
}
.site-mp .landing-head .eyebrow { color: var(--gold-btn); }
.site-mp .landing-head .motto { color: var(--band-ink); font-size: clamp(1.4rem, 3vw, 1.9rem); max-width: 40rem; }
.site-mp .entrance { background: var(--cream); border-color: transparent; outline-color: var(--gold-btn); border-top: 3px solid var(--gold-btn); }
.site-mp .entrance:hover { background: var(--cream); border-color: transparent; border-top-color: var(--band); outline-color: var(--band); }
.site-mp .entrance .name { color: var(--band); }
.site-mp .entrance .lede { color: #4a5568; }
.site-mp .go, .site-mp .button { background: var(--band); color: var(--band-ink); border-color: var(--band); }
.site-mp .entrance:hover .go, .site-mp .go:hover, .site-mp .button:hover { background: var(--gold-btn); border-color: var(--gold-btn); color: var(--band-2); }
.site-mp #view-company { padding-top: 3.5rem; }
.site-mp form { border-top: 3px solid var(--gold-btn); }
.site-mp .pay-card { background: var(--band); border-top: 3px solid var(--gold-btn); }
.site-mp .pay-card h3, .site-mp .pay-card .due strong { color: var(--band-ink); }
.site-mp .pay-card .due, .site-mp .pay-card .handle, .site-mp .pay-card .facts dt, .site-mp .pay-card .facts dd { color: var(--band-ink); }
.site-mp .pay-card .note { color: var(--band-muted); }
.site-mp .pay-card .facts div { border-bottom-color: rgba(243, 238, 226, .2); }
.site-mp .pay-card .venmo { background: var(--gold-btn); border-color: var(--gold-btn); color: var(--band-2); }
.site-mp .pay-card .venmo:hover { background: var(--band-ink); border-color: var(--band-ink); }
.site-mp .tiles .key { background: var(--band); }
.site-mp .tiles .key > span { color: var(--gold-btn); }
.site-mp .tiles .key strong, .site-mp .tiles .key small, .site-mp .tiles .key .neg { color: var(--band-ink); }
.site-mp footer { background: var(--band); border-top: 3px solid var(--gold-btn); }
.site-mp footer .wrap { color: var(--band-muted); }

/* MP Holdings details: suit pinstripes, the logo's house divider, deco corners */
.site-mp .masthead, .site-mp .landing-head, .site-mp footer {
  background-image: repeating-linear-gradient(90deg, rgba(243, 238, 226, .018) 0 1px, transparent 1px 22px);
}
.site-mp .landing-head { background-color: var(--band-2); background-image:
  repeating-linear-gradient(90deg, rgba(243, 238, 226, .018) 0 1px, transparent 1px 22px),
  radial-gradient(ellipse at 50% 120%, rgba(196, 154, 82, .18), transparent 60%),
  linear-gradient(180deg, var(--band-2), var(--band)); }
.site-mp .mp-rule { display: flex; align-items: center; justify-content: center; gap: .9rem; color: var(--gold-btn); margin-top: .6rem; }
.site-mp .mp-rule span { height: 2px; width: min(9rem, 28vw); background: var(--gold-btn); border-radius: 2px; transform-origin: right; animation: rule-in 1.1s .2s cubic-bezier(.2,.7,.2,1) both; }
.site-mp .mp-rule span:last-child { transform-origin: left; }

@keyframes rule-in { from { transform: scaleX(.15); } to { transform: scaleX(1); } }
@keyframes house-in { from { transform: translateY(4px); opacity: .4; } to { transform: none; opacity: 1; } }
.site-mp .entrance { position: relative; transition: transform .3s ease, box-shadow .3s ease, background .25s; }
.site-mp .entrance::before, .site-mp .entrance::after {
  content: ""; position: absolute; width: 26px; height: 26px; border: 0 solid var(--gold-btn); pointer-events: none; transition: width .3s, height .3s;
}
.site-mp .entrance::before { top: 16px; left: 16px; border-top-width: 2px; border-left-width: 2px; }
.site-mp .entrance::after { bottom: 16px; right: 16px; border-bottom-width: 2px; border-right-width: 2px; }
.site-mp .entrance:hover { transform: translateY(-4px); box-shadow: 0 18px 34px -18px rgba(14, 31, 58, .55); }
.site-mp .entrance:hover::before, .site-mp .entrance:hover::after { width: 40px; height: 40px; }
.site-mp .entrance.plain { grid-template-rows: auto auto auto auto; gap: .9rem; padding-block: 2.75rem 2.5rem; }
.site-mp .entrance .icon { color: var(--gold-btn); display: grid; place-items: center; width: 4.25rem; height: 4.25rem; border-radius: 50%; background: var(--band); }
.site-mp .entrance .icon svg { width: 2.3rem; height: 2.3rem; }
@media (prefers-reduced-motion: reduce) { .site-mp .mp-rule span, .site-mp .mp-rule .mp-house { animation: none; } .site-mp .entrance:hover { transform: none; } }

/* Owner portal: one block per property, then one portfolio block */
.pblock { margin: 0 0 2.5rem; background: var(--paper); border: 1px solid var(--rule); border-top: 3px solid var(--gold-btn, var(--brass)); }
.pb-head { display: grid; grid-template-columns: minmax(0, 1fr); }
.pb-photo { position: relative; display: block; padding: 0; border: 0; background: none; cursor: zoom-in; }
.pb-photo img { display: block; width: 100%; height: clamp(12rem, 32vw, 20rem); object-fit: cover; }
.pb-count { position: absolute; right: .9rem; bottom: .9rem; font-family: var(--display); font-size: .78rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #f3eee2; background: rgba(14, 31, 58, .82); padding: .5rem .8rem .45rem; }
.pb-photo:hover .pb-count { background: var(--gold-btn, var(--brass)); color: #0e1f3a; }
.pb-photo:focus-visible { outline: 3px solid var(--gold-btn, var(--brass)); outline-offset: -3px; }
.pb-title { padding: 1.4rem 1.75rem 0; }
.pb-title h2 { font-size: clamp(1.6rem, 3vw, 2.1rem); }
.pb-title p { color: var(--muted); font-size: 1rem; margin-top: .2rem; }
.pb-metrics { margin: 1.1rem 1.75rem 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); }
.pb-metrics div { padding: .8rem .9rem .85rem; min-width: 0; border-bottom: 1px solid var(--rule); }
.pb-metrics div:nth-child(4n+1) { padding-left: 0; }
.pb-metrics dt { font-family: var(--display); font-size: .7rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.pb-metrics dd { margin: .2rem 0 0; font-family: var(--display); font-size: 1.45rem; line-height: 1.15; font-variant-numeric: lining-nums tabular-nums; color: var(--ink); overflow-wrap: anywhere; }
.pb-metrics dd small { font-size: .9rem; color: var(--muted); }
.pb-metrics .key dd { color: var(--ink); font-weight: 600; }
.pblock .p-body { padding: 1.75rem; }
.pblock > .footnote, .pb-portfolio .footnote { margin: 0 1.75rem 1rem; }
.pb-portfolio { background: var(--band, var(--ink)); border-color: var(--band, var(--ink)); }
.pb-portfolio .pb-title h2, .pb-portfolio .pb-metrics dd { color: var(--band-ink, var(--paper)); }
.pb-portfolio .pb-title p, .pb-portfolio .pb-metrics dt, .pb-portfolio .pb-metrics dd small, .pb-portfolio .footnote { color: var(--band-muted, var(--rule)); }
.pb-portfolio .pb-metrics { border-top-color: var(--gold-btn, var(--brass)); border-bottom-color: rgba(243, 238, 226, .18); }
.pb-portfolio .pb-metrics div { border-bottom-color: rgba(243, 238, 226, .18); }
.pb-portfolio .pb-metrics .key dt { color: var(--gold-btn, var(--brass)); }
.pb-portfolio .neg { color: #f0a59a; }
.eb { margin: 1.5rem 1.75rem 1.25rem; }
.eb h4 { font-family: var(--display); font-size: .78rem; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--gold-btn, var(--brass)); margin: 0 0 .8rem; }
.eb ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .9rem; }
.eb-row { display: flex; justify-content: space-between; gap: 1rem; color: var(--band-ink, var(--paper)); font-size: 1rem; margin-bottom: .35rem; }
.eb-row span:last-child { font-variant-numeric: tabular-nums; color: var(--band-muted, var(--rule)); }
.eb-bar { display: flex; height: 14px; gap: 2px; }
.eb-bar span { display: block; }
.eb .owed { background: #c4664a; }
@media (max-width: 720px) { .pb-portfolio .pb-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pb-portfolio .pb-metrics div:nth-child(5n+1) { padding-left: .9rem; } .pb-portfolio .pb-metrics div:nth-child(2n+1) { padding-left: 0; } }
.eb .eq { background: #3aa48a; }
.eb-key { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1.25rem; margin-top: .9rem; font-size: .95rem; color: var(--band-ink, var(--paper)); }
.eb-key span { display: inline-flex; align-items: center; gap: .45rem; }
.eb-key i { display: inline-block; width: 12px; height: 12px; }
.pb-portfolio .pb-metrics { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.pb-portfolio .pb-metrics div:nth-child(4n+1) { padding-left: .9rem; }
.pb-portfolio .pb-metrics div:nth-child(5n+1) { padding-left: 0; }
@media (max-width: 720px) {
  .pb-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-inline: 1.1rem; }
  .pb-metrics div:nth-child(4n+1) { padding-left: .9rem; }
  .pb-metrics div:nth-child(2n+1) { padding-left: 0; }
  .pb-title { padding-inline: 1.1rem; }
  .pblock .p-body { padding: 1.25rem 1.1rem; }
  .pblock > .footnote, .pb-portfolio .footnote, .eb { margin-inline: 1.1rem; }
}

/* About */
.heraldry { max-width: var(--measure); margin: 0 auto; padding: 1.75rem 2rem; background: var(--paper-2); border-top: 1px solid var(--brass); }
.heraldry p { color: var(--ink-soft); font-size: 1.05rem; }
.heraldry .eyebrow { margin-bottom: .6rem; }

/* Footer */
footer { border-top: 1px solid var(--rule); }
footer .wrap { padding-block: 2rem 2.5rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: .75rem 2rem; font-family: var(--display); font-size: .85rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }

.view { animation: rise .6s ease both; }
@keyframes rise { from { opacity: .001; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .view { animation: none; } * { transition: none !important; } }

@media (max-width: 720px) {
  body { font-size: 1.125rem; }
  main { padding-block: 3rem 3.5rem; }
  .entrances { grid-template-columns: 1fr; gap: 1.5rem; }
  .entrance { grid-template-rows: 8.5rem auto auto auto; padding: 2.25rem 1.25rem 2rem; }
  .entrance .crest { height: 8rem; }
  .entrance .mp-mark { width: 12rem; }
  .entrance .name { font-size: 1.45rem; }
  .portal .sections { grid-template-columns: 1fr; }
  .tenant-grid { grid-template-columns: 1fr; gap: 2rem; }
  .pay-card { grid-row: auto; padding: 1.4rem 1.25rem; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tiles div + div { border-left: 0; }
  .tiles div:nth-child(even) { border-left: 1px solid var(--rule); }
  .tiles div:nth-child(n+3) { border-top: 1px solid var(--rule); }
  .tiles .key { grid-column: 1 / -1; border-left: 0 !important; }
  .p-body { grid-template-columns: 1fr; padding-left: 0; gap: 1.75rem; }
  .months { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .p-name strong { font-size: 1.2rem; }
  nav ul { gap: .25rem 1.4rem; }
  nav a { font-size: .8rem; letter-spacing: .18em; }
  form { padding: 1.75rem 1.25rem; }
  .heraldry { padding: 1.5rem 1.25rem; }
}

/* Owner portal: property photo gallery */
#owner-gallery { margin-top: 3rem; padding-top: 2.25rem; border-top: 1px solid var(--rule); }
#owner-gallery .og-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .5rem 1.5rem; margin-bottom: 1.5rem; }
#owner-gallery .og-eyebrow { margin: 0 0 .35rem; font-family: var(--display); font-size: .8rem; letter-spacing: .24em; text-transform: uppercase; color: var(--brass); }
#owner-gallery h3 { margin: 0; font-family: var(--display); font-weight: 500; font-size: clamp(1.6rem, 4vw, 2.1rem); line-height: 1.15; color: var(--ink); }
#owner-gallery .og-meta { margin: 0; font-size: 1rem; color: var(--muted); }
#owner-gallery .og-hero { display: block; width: 100%; padding: 0; border: 1px solid var(--rule); background: var(--paper-2); cursor: zoom-in; overflow: hidden; }
#owner-gallery .og-hero img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
#owner-gallery ul { list-style: none; margin: 1rem 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .6rem; }
#owner-gallery .og-thumb { display: block; width: 100%; padding: 0; border: 1px solid var(--rule); background: var(--paper-2); cursor: zoom-in; overflow: hidden; }
#owner-gallery .og-thumb img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; transition: transform .35s ease, opacity .2s; }
#owner-gallery .og-thumb.plan img { object-fit: contain; background: #fff; }
#owner-gallery .og-thumb:hover img { transform: scale(1.04); }
#owner-gallery button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
/* Property icons in the owner portal's Properties table */
.prop-icon { display: inline-block; vertical-align: middle; width: 56px; height: 42px; margin: -.3rem .75rem -.3rem 0; padding: 0; border: 1px solid var(--rule); background: var(--paper-2); cursor: zoom-in; overflow: hidden; flex: none; }
.prop-icon img { display: block; width: 100%; height: 100%; object-fit: cover; }
.prop-icon:hover { border-color: var(--brass); }
.prop-icon:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.prop-cell { white-space: nowrap; }
@media (max-width: 560px) { .prop-icon { width: 44px; height: 33px; margin-right: .55rem; } }
.og-box { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .9rem; padding: 3.25rem 16px 1.25rem; background: rgba(8, 14, 24, .94); color: #ece8dd; }
.og-box[hidden] { display: none !important; }
.og-box img { max-width: min(100%, 1400px); max-height: calc(100vh - 8rem); object-fit: contain; background: #fff0; }
.og-box .og-cap { margin: 0; font-family: var(--display); font-size: 1.05rem; letter-spacing: .06em; text-align: center; }
.og-box .og-cap span { color: #b9b3a3; margin-left: .6rem; font-size: .9rem; }
.og-box button { position: absolute; border: 0; background: none; color: #ece8dd; font: 400 2.2rem/1 var(--display); cursor: pointer; padding: .4rem .7rem; }
.og-box button:hover { color: var(--gold); }
.og-box .og-close { top: .5rem; right: .5rem; }
.og-box .og-prev { left: .25rem; top: 50%; transform: translateY(-50%); }
.og-box .og-next { right: .25rem; top: 50%; transform: translateY(-50%); }
@media (max-width: 560px) { #owner-gallery ul { grid-template-columns: repeat(3, 1fr); gap: .4rem; } .og-box .og-prev, .og-box .og-next { top: auto; bottom: .5rem; transform: none; } }
/* Owner portal: the masthead becomes one slim bar with the portal's navigation */
body.portal-on .masthead .wrap { display: flex; align-items: center; justify-content: space-between; gap: .75rem 2rem; flex-wrap: wrap; padding-block: .85rem; max-width: 72rem; }
body.portal-on .brand { display: flex; align-items: center; gap: .8rem; }
body.portal-on .brand .mp-mark { width: 3.4rem; }
body.portal-on .wordmark { font-size: .95rem; letter-spacing: .32em; margin-right: 0; }
body.portal-on .portal-bar { display: none; }
body.portal-on .masthead { position: sticky; top: 0; z-index: 20; }
body.portal-on #portal-content *, body.portal-on #owner-gallery { scroll-margin-top: 6.5rem; }
body.portal-on.view-prop #portal-content { display: none; }
body.portal-on.has-pages:not(.view-springer) #owner-gallery { display: none !important; }
body.portal-on #view-company { padding-top: 2.75rem; }
body.portal-on .portal-dup { display: none !important; }
.pnav { display: flex; align-items: center; gap: 1rem 2rem; flex-wrap: wrap; justify-content: flex-end; flex: 1 1 auto; }
.pnav[hidden] { display: none !important; }
.pnav ul { list-style: none; margin: 0; padding: 0; display: flex; justify-content: flex-start; gap: .25rem 1.9rem; flex-wrap: nowrap; }
.pnav button { font-family: var(--display); font-size: .82rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--band-muted, #aeb6c4); background: none; border: 0; border-bottom: 1px solid transparent; padding: .45rem 0 .3rem; cursor: pointer; white-space: nowrap; transition: color .2s, border-color .2s; }
.pnav button:hover { color: var(--band-ink, #f3eee2); border-bottom-color: rgba(243, 238, 226, .35); }
.pnav button[aria-current="page"] { color: var(--band-ink, #f3eee2); border-bottom-color: var(--gold-btn, #c49a52); }
.pnav button:focus-visible { outline: 2px solid var(--gold-btn, #c49a52); outline-offset: 3px; }
.pnav .pnav-out { color: var(--gold-btn, #c49a52); padding-left: 1.6rem; border-left: 1px solid rgba(243, 238, 226, .2); border-bottom: 1px solid transparent; }
.pnav .pnav-out:hover { color: var(--band-ink, #f3eee2); border-bottom-color: transparent; }
@media (max-width: 760px) {
  body.portal-on .masthead .wrap { padding-block: .75rem .25rem; row-gap: .35rem; }
  .pnav { flex-basis: 100%; justify-content: space-between; gap: 1rem; }
  .pnav { min-width: 0; flex-wrap: nowrap; }
  .pnav ul { overflow-x: auto; min-width: 0; flex: 1 1 auto; gap: 1.3rem; padding-bottom: .35rem; scrollbar-width: none; }
  .pnav ul::-webkit-scrollbar { display: none; }
  .pnav button { font-size: .74rem; letter-spacing: .16em; }
  .pnav .pnav-out { padding-left: 1rem; }
  body.portal-on #view-company { padding-top: 2rem; }
}
/* Owner portal: Properties shown as side-by-side cards with exterior photos */
.pcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.25rem; margin: 1.5rem 0 1rem; }
.pcard { position: relative; display: flex; flex-direction: column; background: var(--cream, #f2ecdf); border-top: 3px solid var(--gold-btn, #c49a52); color: var(--ink); text-align: left; transition: box-shadow .25s, transform .25s; }
.pcard:hover { box-shadow: 0 10px 28px rgba(15, 33, 58, .12); transform: translateY(-2px); }
.pcard .pc-photo { display: block; width: 100%; padding: 0; border: 0; background: var(--paper-2); cursor: zoom-in; overflow: hidden; }
.pcard .pc-photo img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; transition: transform .5s ease; }
.pcard .pc-photo:hover img { transform: scale(1.03); }
.pcard .pc-body { display: flex; flex-direction: column; gap: 1rem; padding: 1.25rem 1.35rem 1.35rem; flex: 1; }
.pcard .pc-name { margin: 0; font-family: var(--display); font-weight: 500; font-size: 1.55rem; line-height: 1.15; color: var(--band, var(--ink)); }
.pcard .pc-name small { display: block; margin-top: .2rem; font-family: var(--text); font-size: .95rem; color: var(--muted); }
.pcard dl, .ptotal dl { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); gap: .9rem 1.25rem; }
.pcard dt, .ptotal dt { font-family: var(--display); font-size: .72rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); line-height: 1.3; }
.pcard dd, .ptotal dd { margin: .15rem 0 0; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.pcard .pc-open { margin-top: auto; align-self: flex-start; font-family: var(--display); font-size: .8rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--band, var(--ink)); background: none; border: 0; border-bottom: 1px solid var(--gold-btn, #c49a52); padding: .3rem 0; cursor: pointer; }
.pcard .pc-open:hover { color: var(--brass); }
.pcard button:focus-visible, .ptotal button:focus-visible { outline: 2px solid var(--gold-btn, #c49a52); outline-offset: 3px; }
.ptotal { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 2rem; margin: 0 0 1.5rem; padding: 1.1rem 1.35rem; background: var(--band, var(--ink)); color: var(--band-ink, #f3eee2); }
.ptotal .pt-label { font-family: var(--display); font-size: .85rem; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--gold-btn, #c49a52); }
.ptotal dl { flex: 1; }
.ptotal dt { color: var(--band-muted, #aeb6c4); }
.ptotal dd { color: var(--band-ink, #f3eee2); }
.pc-hidden { display: none !important; }
@media (max-width: 560px) { .pcards { grid-template-columns: 1fr; } .pcard .pc-name { font-size: 1.35rem; } }
/* Owner portal: one landing page per property */
#prop-pages > .ppage[hidden] { display: none !important; }
.ppage { display: grid; gap: 2rem; }
.pp-back { justify-self: start; font-family: var(--display); font-size: .8rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); background: none; border: 0; border-bottom: 1px solid transparent; padding: .3rem 0; cursor: pointer; }
.pp-back:hover { color: var(--ink); border-bottom-color: var(--gold-btn, #c49a52); }
.pp-hero { position: relative; display: block; width: 100%; padding: 0; border: 0; border-top: 3px solid var(--gold-btn, #c49a52); background: var(--paper-2); cursor: zoom-in; overflow: hidden; }
.pp-hero img { display: block; width: 100%; aspect-ratio: 21 / 9; object-fit: cover; }
.pp-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1rem 2rem; margin-top: -.5rem; }
.pp-head h2 { margin: 0; font-family: var(--display); font-weight: 500; font-size: clamp(2.1rem, 5vw, 3.2rem); line-height: 1.05; color: var(--band, var(--ink)); }
.pp-head .pp-sub { margin: .45rem 0 0; color: var(--muted); font-size: 1.05rem; }
.pp-cf { text-align: right; }
.pp-cf span { display: block; font-family: var(--display); font-size: .74rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.pp-cf strong { font-family: var(--display); font-weight: 500; font-size: 2rem; color: var(--band, var(--ink)); }
.pp-cf strong.neg { color: var(--danger, #8a2a2a); }
.pp-stats { padding: 1.1rem 1.35rem; background: var(--cream, #f2ecdf); border-left: 3px solid var(--gold-btn, #c49a52); }
.pp-stats dl { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: .9rem 1.5rem; }
.pp-stats dt { font-family: var(--display); font-size: .72rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.pp-stats dd { margin: .15rem 0 0; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.pp-body > details > summary.pp-sum-hidden, .pp-body .pp-sum-hidden { display: none !important; }
.pp-body > details, .pp-body > * { border: 0 !important; margin: 0 !important; padding-left: 0 !important; padding-right: 0 !important; }
@media (max-width: 560px) { .pp-hero img { aspect-ratio: 16 / 10; } .pp-cf { text-align: left; } }
/* Tenant portal: pay by check */
.pay-card .check { display: grid; gap: .55rem; }
.pay-card .check .or { display: flex; align-items: center; gap: .8rem; margin: .4rem 0 .1rem; font-family: var(--display); font-size: .78rem; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
.pay-card .check .or::before, .pay-card .check .or::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.pay-card .check h4 { margin: 0; font-family: var(--display); font-weight: 500; font-size: 1.2rem; letter-spacing: 0; text-transform: none; color: var(--ink); }
.pay-card .check p { margin: 0; color: var(--ink-soft); font-size: 1rem; }
.pay-card .check address { font-style: normal; font-size: 1.05rem; line-height: 1.45; color: var(--ink); user-select: all; }
.site-mp .pay-card .check .or { color: var(--band-muted); }
.site-mp .pay-card .check .or::before, .site-mp .pay-card .check .or::after { background: rgba(243, 238, 226, .22); }
.site-mp .pay-card .check h4, .site-mp .pay-card .check address, .site-mp .pay-card .check strong { color: var(--band-ink); }
.site-mp .pay-card .check p:not(.note) { color: var(--band-ink); }
/* ---- Owner portal charts ---- */
.viz { --s1: #2c5aa0; --s2: #b8862e; --s3: #0d8f7a; --s4: #bf5a3c; --s5: #7a5cc0; --viz-surface: var(--paper); --viz-grid: var(--rule); --viz-ink: var(--ink); --viz-soft: var(--ink-soft); --viz-muted: var(--muted); }
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) .viz { --s1: #4f7fd0; --s2: #ad8435; --s3: #1a9f88; --s4: #d06a48; --s5: #9580dc; } }
:root[data-theme="dark"] .viz { --s1: #4f7fd0; --s2: #ad8435; --s3: #1a9f88; --s4: #d06a48; --s5: #9580dc; }
.viz-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.25rem; margin: 0 0 1.75rem; }
.viz { background: var(--viz-surface); border: 1px solid var(--rule); padding: 1.15rem 1.25rem 1rem; min-width: 0; }
.viz-head { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem 1rem; flex-wrap: wrap; margin-bottom: .35rem; }
.viz h4 { margin: 0; font-family: var(--display); font-size: .78rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--brass); }
.viz .viz-sub { margin: 0 0 .9rem; font-size: .95rem; color: var(--viz-muted); line-height: 1.4; }
.viz-tbtn { font-family: var(--display); font-size: .7rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--viz-muted); background: none; border: 0; border-bottom: 1px solid var(--rule); padding: .1rem 0; cursor: pointer; }
.viz-tbtn:hover { color: var(--viz-ink); }
.viz-tbtn:focus-visible, .viz [tabindex]:focus-visible { outline: 2px solid var(--gold-btn, #c49a52); outline-offset: 2px; }
.viz-seg { display: flex; gap: 2px; height: 40px; background: var(--viz-surface); }
.viz-seg > span { display: block; min-width: 3px; height: 100%; transition: opacity .15s; cursor: default; }
.viz-seg > span:first-child { border-radius: 4px 0 0 4px; }
.viz-seg > span:last-child { border-radius: 0 4px 4px 0; }
.viz-seg > span:only-child { border-radius: 4px; }
.viz-seg:hover > span:not(:hover) { opacity: .55; }
.viz-legend { list-style: none; margin: .85rem 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: .55rem 1rem; }
.viz-legend li { display: grid; grid-template-columns: 10px 1fr; column-gap: .5rem; align-items: start; font-size: .92rem; line-height: 1.3; color: var(--viz-soft); }
.viz-legend i { width: 10px; height: 10px; border-radius: 2px; margin-top: .3rem; }
.viz-legend b { display: block; font-weight: 500; color: var(--viz-ink); font-variant-numeric: tabular-nums; }
.viz-legend small { color: var(--viz-muted); font-size: .85rem; }

.viz-row .viz-rlabel span { color: var(--viz-muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.viz-row .viz-seg { height: 22px; }
.viz-line { position: relative; }
.viz-line svg { display: block; width: 100%; overflow: visible; }
.viz-line text { font-family: var(--text); font-size: 12px; fill: var(--viz-muted); font-variant-numeric: tabular-nums; }
.viz-line .lbl { font-size: 13px; fill: var(--viz-ink); }
.viz-table { width: 100%; margin-top: .9rem; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
.viz-table th, .viz-table td { text-align: right; padding: .3rem .4rem; border-bottom: 1px solid var(--rule); }
.viz-table th:first-child, .viz-table td:first-child { text-align: left; }
.viz-table th { font-weight: 600; color: var(--viz-muted); font-size: .8rem; letter-spacing: .06em; }
.viz-tablewrap { max-height: 16rem; overflow: auto; }
.viz-tip { position: fixed; z-index: 60; pointer-events: none; background: var(--band, #14294a); color: var(--band-ink, #f3eee2); padding: .45rem .65rem; font-size: .85rem; line-height: 1.35; box-shadow: 0 6px 18px rgba(0,0,0,.18); max-width: 16rem; font-variant-numeric: tabular-nums; }
.viz-tip[hidden] { display: none; }
.viz-tip b { font-weight: 600; }
.viz-tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: .4rem; }
.pp-viz { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.25rem; }
</style>

        <span class="name">OWNERS</span>
        <span class="go">Owner Login</span>

        <span class="icon"><svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 42V12a12 12 0 0 1 24 0v30"/><path d="M8 42h32"/><path d="M17 42V14a7 7 0 0 1 14 0v28"/><circle cx="27" cy="29" r="1.2" fill="currentColor"/></svg></span>
        <span class="name">TENANTS</span>

<script>
document.getElementById("year").textContent = new Date().getFullYear();

const COMPANIES = {
  "cadency":     { name: "CADENCY",     title: "Cadency",     logo: '<span class="crest" aria-hidden="true"></span>' },
  "mp-holdings": { name: "MP HOLDINGS", title: "MP Holdings", logo: '<span class="mp-mark" aria-hidden="true"></span>' }
};
// Each sign-in page: which company it belongs to and which encrypted entry it opens.
const ALL_PORTALS = {
  "cadency":   { company: "cadency",     vault: "cadency",     heading: "Executive Login", label: "Executive Portal", perUser: true },
  "mp-owner":  { company: "mp-holdings", vault: "mp-holdings", heading: "Owner Login",     label: "Owner Portal", perUser: true },
  "mp-tenant": { company: "mp-holdings", vault: "mp-tenants",  heading: "Tenant Login",    label: "Tenant Portal", perUser: true }
};
const SITE_TITLE = "MP Holdings";
// Only the sign-in pages this site offers.
const PORTALS = Object.fromEntries(["mp-owner","mp-tenant"].map(id => [id, ALL_PORTALS[id]]));
const ALIASES = { "mp-holdings": "mp-owner" };
const VAULT = JSON.parse(document.getElementById("vault").textContent);
const unlocked = {}; // decrypted portal HTML, kept in memory only

const $ = id => document.getElementById(id);
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");

async function decryptPortal(id, username, password) {
  const portal = PORTALS[id];
  const user = username.trim().toLowerCase();
  let v = VAULT[portal.vault];
  if (portal.perUser) {
    const k = hex(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(portal.vault + "\n" + user)));
    v = v && v[k];
    if (!v) throw new Error("unknown user");
  }
  const secret = new TextEncoder().encode(user + "\n" + password);
  const base = await crypto.subtle.importKey("raw", secret, "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: fromB64(v.salt), iterations: v.iterations, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(v.iv) }, key, fromB64(v.data));
  return new TextDecoder().decode(plain);
}

let current = "home";
function show() {
  let hash = location.hash.slice(1);
  if (ALIASES[hash]) { location.replace("#" + ALIASES[hash]); return; }
  current = (hash === "about" && $("view-about")) || PORTALS[hash] ? hash : "home";
  const isPortal = !!PORTALS[current];
  $("view-home").hidden = current !== "home";
  if ($("view-about")) $("view-about").hidden = current !== "about";
  $("view-company").hidden = !isPortal;
  document.querySelectorAll("nav a").forEach(a => {
    const on = a.dataset.view === current || (isPortal && a.dataset.view === "home");
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });

  if (isPortal) {
    const portal = PORTALS[current], c = COMPANIES[portal.company];
    const open = !!unlocked[current];
    $("login").hidden = open;
    $("portal").hidden = !open;
    if (open) {
      $("portal-logo").innerHTML = c.logo;
      $("portal-name").textContent = c.title;
      $("portal-content").innerHTML = unlocked[current];
      document.title = c.title + " · " + portal.label;
    } else {
      $("login-logo").innerHTML = c.logo;
      $("login-name").textContent = c.name;
      $("login-title").textContent = portal.heading;
      $("login-error").textContent = "";
      $("login-form").reset();
      $("portal-content").innerHTML = "";
      document.title = c.title + " · " + portal.heading;
    }
  } else {
    $("portal-content").innerHTML = "";
    document.title = current === "about" ? SITE_TITLE + " · About Us" : SITE_TITLE;
  }
  if (typeof syncGallery === "function") syncGallery();
  window.scrollTo(0, 0);
}

$("login-form").addEventListener("submit", async e => {
  e.preventDefault();
  const id = current, user = $("f-user").value, pass = $("f-pass").value;
  if (!user.trim() || !pass) {
    $("login-error").textContent = "Enter your username and password.";
    (user.trim() ? $("f-pass") : $("f-user")).focus();
    return;
  }
  const btn = $("login-submit");
  btn.disabled = true; btn.textContent = "Signing In…";
  $("login-error").textContent = "";
  try {
    unlocked[id] = await decryptPortal(id, user, pass);
    show();
  } catch {
    $("login-error").textContent = "That username and password don't match. Please try again.";
    $("f-pass").value = "";
    $("f-pass").focus();
  } finally {
    btn.disabled = false; btn.textContent = "Sign In";
  }
});

$("sign-out").addEventListener("click", () => {
  delete unlocked[current];
  location.hash = "";
});


// Photo viewer for the owner portal. Each property block's photo opens it: a property with a
// gallery steps through all its photos; one without shows its single exterior photo.
const GALLERIES = {
  springer: { name: "2981 Springer Ave", path: i => "photos/springer-" + String(i + 1).padStart(2, "0") + ".jpg",
    caps: ["Front exterior", "Exterior and driveway", "Living room", "Living room", "Dining room", "Dining room", "Front porch", "Front porch", "Kitchen", "Kitchen", "Office", "Bathroom", "Bedroom", "Bedroom", "Upstairs bedroom", "Upstairs bedroom", "Upstairs bathroom", "Upstairs loft", "Upstairs loft", "Backyard and garage", "Backyard and garage", "Floor plan \u00b7 Floor 1", "Floor plan \u00b7 Both floors", "Floor plan \u00b7 Floor 2"] }
};
let ogG = null, ogI = -1;
function showPhoto(src, cap, counter) {
  $("og-img").src = src; $("og-img").alt = cap;
  $("og-cap").textContent = cap;
  if (counter) { const n = document.createElement("span"); n.textContent = counter; $("og-cap").append(n); }
  document.querySelector(".og-prev").hidden = document.querySelector(".og-next").hidden = !counter;
  $("og-box").hidden = false; document.body.style.overflow = "hidden";
}
function openGallery(key, i) {
  const g = GALLERIES[key]; if (!g) return;
  ogG = g; ogI = (i + g.caps.length) % g.caps.length;
  showPhoto(g.path(ogI), g.name + " \u00b7 " + g.caps[ogI], (ogI + 1) + " / " + g.caps.length);
}
function closeBox() { if (!$("og-box").hidden) { $("og-box").hidden = true; document.body.style.overflow = ""; } ogG = null; }
function syncGallery() { if (!(current === "mp-owner" && unlocked["mp-owner"])) closeBox(); }
$("portal-content").addEventListener("click", e => {
  const b = e.target.closest(".pb-photo"); if (!b) return;
  if (b.dataset.gallery) openGallery(b.dataset.gallery, 0);
  else showPhoto(b.dataset.single, b.dataset.cap || "", "");
});
$("og-box").addEventListener("click", e => {
  if (e.target.closest(".og-prev") && ogG) openGallery(Object.keys(GALLERIES).find(k => GALLERIES[k] === ogG), ogI - 1);
  else if (e.target.closest(".og-next") && ogG) openGallery(Object.keys(GALLERIES).find(k => GALLERIES[k] === ogG), ogI + 1);
  else if (e.target.closest(".og-close") || e.target === $("og-box")) closeBox();
});
document.addEventListener("keydown", e => {
  if ($("og-box").hidden) return;
  if (e.key === "Escape") closeBox();
  else if (ogG && (e.key === "ArrowLeft" || e.key === "ArrowRight")) openGallery(Object.keys(GALLERIES).find(k => GALLERIES[k] === ogG), ogI + (e.key === "ArrowRight" ? 1 : -1));
});
window.addEventListener("hashchange", show);
show();
</script>
