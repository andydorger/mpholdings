/* Layout: a quiet clubhouse page. Centered crest masthead, two framed entrances on the landing page, hairline brass rules, wide-tracked capitals. */
:root {
  --paper: #f8f7f3;
  --paper-2: #efede6;
  --ink: #0f213a;
  --ink-soft: #3c4a5e;
  --muted: #6b7584;
  --brass: #9b7d4e;
  --gold: #b8955a;
  --rule: #d9d4c7;
  --crest: #0f213a;
  --danger: #8a2a2a;
  --ok: #2f6b4a; --ok-bg: #e3eee6; --warn: #8a6216; --warn-bg: #f4ead3; --bad: #9a2f2f; --bad-bg: #f5e1de;
  --display: "Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
  --text: "EB Garamond", Garamond, Georgia, "Times New Roman", serif;
  --measure: 36rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0c1829; --paper-2: #122238; --ink: #ece8dd; --ink-soft: #c5c3ba;
    --muted: #8f97a3; --brass: #c4a571; --gold: #c9a868; --rule: #2a3a52; --crest: #ece8dd; --danger: #e09a8f; --ok: #8fcaa6; --ok-bg: #173527; --warn: #e2bf7a; --warn-bg: #3a2f17; --bad: #ec9e94; --bad-bg: #3d1f1f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0c1829; --paper-2: #122238; --ink: #ece8dd; --ink-soft: #c5c3ba;
  --muted: #8f97a3; --brass: #c4a571; --gold: #c9a868; --rule: #2a3a52; --crest: #ece8dd; --danger: #e09a8f; --ok: #8fcaa6; --ok-bg: #173527; --warn: #e2bf7a; --warn-bg: #3a2f17; --bad: #ec9e94; --bad-bg: #3d1f1f; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--text);
  font-size: 1.1875rem;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.wrap {
  max-width: 64rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Masthead */
.masthead { border-bottom: 1px solid var(--rule); }
.masthead .wrap { display: grid; justify-items: center; gap: 1.1rem; padding-block: 2rem 1.25rem; }
.brand { display: grid; justify-items: center; gap: .6rem; color: inherit; text-decoration: none; }
.brand .crest { width: 2.6rem; }
.brand .mp-mark { width: 5.5rem; }
.entrance.plain { grid-template-rows: auto auto auto; align-items: center; padding-block: 2.5rem 2.25rem; }
.entrance.plain .lede { color: var(--ink-soft); font-size: 1.05rem; max-width: 18rem; }
.wordmark {
  font-family: var(--display);
  font-weight: 500;
  font-size: 1.5rem;
  letter-spacing: .42em;
  margin-right: -.42em; /* optical centering for tracked caps */
  line-height: 1;
}
nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: .25rem 2.25rem; }
nav a {
  font-family: var(--display);
  font-size: .9rem;
  font-weight: 600;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--ink-soft);
  text-decoration: none;
  padding-block: .35rem;
  border-bottom: 1px solid transparent;
  transition: color .2s, border-color .2s;
}
nav a:hover { color: var(--ink); border-bottom-color: var(--rule); }
nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--brass); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }

/* Shared type */
main { padding-block: 4rem 5rem; }
.eyebrow {
  font-family: var(--display);
  font-size: .85rem;
  font-weight: 600;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--brass);
  margin: 0 0 1rem;
}
h1, h2, h3 { font-family: var(--display); font-weight: 500; text-wrap: balance; margin: 0; color: var(--ink); }
h1 { font-size: clamp(2.4rem, 5.5vw, 3.6rem); line-height: 1.08; letter-spacing: .005em; }
h2 { font-size: clamp(1.6rem, 3.2vw, 2.1rem); line-height: 1.15; }
h3 { font-size: 1.4rem; line-height: 1.2; }
p { margin: 0; }
.prose { max-width: var(--measure); margin-inline: auto; display: grid; gap: 1.25rem; color: var(--ink-soft); }
.prose .lede { font-size: 1.35rem; line-height: 1.55; color: var(--ink); }
.page-head { text-align: center; display: grid; justify-items: center; gap: .25rem; margin-bottom: 3rem; }
.ornament { display: flex; align-items: center; justify-content: center; gap: .9rem; color: var(--brass); margin-block: 2.75rem; }
.ornament::before, .ornament::after { content: ""; height: 1px; width: 4.5rem; background: var(--rule); }
.ornament span { width: 6px; height: 6px; transform: rotate(45deg); border: 1px solid currentColor; }

.button {
  display: inline-block;
  font-family: var(--display);
  font-size: .9rem;
  font-weight: 600;
  letter-spacing: .22em;
  text-transform: uppercase;
  text-decoration: none;
  text-align: center;
  color: var(--ink);
  border: 1px solid var(--ink);
  background: transparent;
  padding: .85rem 1.6rem .8rem;
  cursor: pointer;
  transition: background .25s, color .25s;
}
.button:hover { background: var(--ink); color: var(--paper); }
.button[disabled] { opacity: .6; cursor: progress; }
.link {
  font-family: var(--display); font-size: .85rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
  color: var(--ink-soft); text-decoration: none; background: none; border: 0; padding: .25rem 0; cursor: pointer;
  border-bottom: 1px solid var(--rule);
}
.link:hover { color: var(--ink); border-bottom-color: var(--brass); }

/* Landing: two entrances */
.landing-head { text-align: center; display: grid; justify-items: center; gap: .9rem; margin-bottom: 3rem; }
.landing-head .motto { font-style: italic; font-size: 1.3rem; color: var(--ink-soft); max-width: 30rem; }
.entrances { max-width: 52rem; margin: 0 auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2rem; }
.entrance {
  display: grid;
  grid-template-rows: 11rem auto auto auto;
  justify-items: center;
  align-items: end;
  gap: 1.1rem;
  text-align: center;
  padding: 2.75rem 1.5rem 2.25rem;
  border: 1px solid var(--rule);
  outline: 1px solid var(--rule);
  outline-offset: -8px;
  color: inherit;
  text-decoration: none;
  transition: border-color .25s, outline-color .25s, background .25s;
}
.entrance:hover { border-color: var(--brass); outline-color: var(--brass); background: var(--paper-2); }
.entrance:focus-visible { outline: 2px solid var(--brass); outline-offset: -8px; }
.entrance .crest { height: 10.5rem; width: auto; }
.entrance .mp-mark { width: 15rem; }
.entrance .name { font-family: var(--display); font-weight: 500; font-size: 1.7rem; letter-spacing: .3em; margin-right: -.3em; line-height: 1.1; }
.entrance .eyebrow { margin: 0; color: var(--muted); }
.entrance .go { font-family: var(--display); font-size: .85rem; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--ink); border: 1px solid var(--ink); padding: .7rem 1.4rem .65rem; margin-top: .4rem; transition: background .25s, color .25s; }
.entrance:hover .go { background: var(--ink); color: var(--paper); }

/* Login */
.login { max-width: 26rem; margin: 0 auto; display: grid; gap: 2rem; }
.login-head { display: grid; justify-items: center; gap: 1rem; text-align: center; }
.login-head .crest { height: 6.5rem; width: auto; }
.login-head .mp-mark { width: 10rem; }
.login-head .name { font-family: var(--display); font-weight: 500; font-size: 1.35rem; letter-spacing: .3em; margin-right: -.3em; line-height: 1.1; }
form { display: grid; gap: 1.4rem; padding: 2rem 1.75rem; border-top: 1px solid var(--brass); background: var(--paper-2); }
.field { display: grid; gap: .35rem; }
.field label { font-family: var(--display); font-size: .8rem; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-soft); }
.field input {
  font: inherit; font-size: 1.1rem; color: var(--ink); background: transparent;
  border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; padding: .45rem 0; width: 100%;
}
.field input:focus { border-color: var(--ink); outline: none; }
.form-error { color: var(--danger); font-size: 1rem; font-style: italic; }
.form-error:empty { display: none; }
form .button { width: 100%; }
.login-foot { text-align: center; }

/* Portal (content arrives decrypted) */
.portal-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; padding-bottom: 1.25rem; margin-bottom: 3rem; border-bottom: 1px solid var(--rule); }
.portal-bar .who { display: flex; align-items: center; gap: .9rem; min-width: 0; }
.portal-bar .crest { height: 2.6rem; width: auto; }
.portal-bar .mp-mark { width: 4.5rem; }
.portal-bar .name { font-family: var(--display); font-weight: 600; font-size: .9rem; letter-spacing: .24em; text-transform: uppercase; }
.portal { display: grid; gap: 3rem; }
.portal .intro { max-width: var(--measure); display: grid; gap: .9rem; }
.portal .intro p { color: var(--ink-soft); }
.portal .sections { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.25rem 3rem; }
.portal section { display: grid; gap: .75rem; align-content: start; padding-top: 1.1rem; border-top: 1px solid var(--ink); }
.portal section h3 { font-size: 1.3rem; }

.portal ul { margin: 0; padding: 0; list-style: none; display: grid; gap: .5rem; }
.portal li a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; }
.portal li a:hover { text-decoration-color: var(--brass); }

/* Portfolio (MP Holdings) */
.portal .sample-note { font-style: italic; color: var(--warn); font-size: 1rem; }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); }

.tiles strong { font-family: var(--display); font-weight: 500; font-size: clamp(1.35rem, 2.4vw, 1.75rem); line-height: 1.1; font-variant-numeric: lining-nums tabular-nums; overflow-wrap: anywhere; }

.block { display: grid; gap: 1.1rem; }
.block > h3 { font-size: 1.5rem; }
.scroll { overflow-x: auto; }
.portal table { width: 100%; border-collapse: collapse; font-size: 1rem; font-variant-numeric: lining-nums tabular-nums; }
.portal th { font-family: var(--display); font-size: .72rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--ink); white-space: nowrap; }
.portal td { padding: .65rem .75rem; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.portal td:first-child, .portal th:first-child { padding-left: 0; }
.portal td:last-child, .portal th:last-child { padding-right: 0; }
.portal .num { text-align: right; }
.portal tfoot td { border-bottom: 0; border-top: 1px solid var(--ink); font-weight: 500; color: var(--ink); }
.portal .strong { font-weight: 500; color: var(--ink); }
.portal .neg { color: var(--bad); }
.portal .na { color: var(--muted); }
.ledger-table td { color: var(--ink-soft); }
.maint td:nth-child(2) { white-space: normal; min-width: 12rem; }

.properties { display: grid; border-top: 1px solid var(--ink); }
.property { border-bottom: 1px solid var(--rule); }
.property summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1.15rem 0; }
.property summary::-webkit-details-marker { display: none; }
.property summary::before { content: ""; flex: none; width: 7px; height: 7px; border-right: 1px solid var(--brass); border-bottom: 1px solid var(--brass); transform: rotate(-45deg); transition: transform .2s; margin-right: .25rem; }
.property[open] summary::before { transform: rotate(45deg); }
.property summary:hover strong { text-decoration: underline; text-decoration-color: var(--brass); text-underline-offset: 5px; }
.property summary:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.p-name { display: grid; gap: .1rem; flex: 1; min-width: 0; }
.p-name strong { font-family: var(--display); font-weight: 500; font-size: 1.4rem; line-height: 1.2; }
.p-name span { color: var(--muted); font-size: 1rem; }
.p-flow { display: grid; justify-items: end; gap: .1rem; font-size: 1.15rem; font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
.p-flow > span:first-child { font-family: var(--display); font-size: .7rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.p-body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2rem 3rem; padding: .5rem 0 2.25rem 1.6rem; }
.panel { display: grid; gap: .6rem; align-content: start; min-width: 0; }
.panel.wide { grid-column: 1 / -1; }
.panel h4 { font-family: var(--display); font-size: .78rem; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--brass); margin: 0; }
.facts { margin: 0; display: grid; }
.facts div { display: flex; justify-content: space-between; gap: 1rem; padding: .4rem 0; border-bottom: 1px dotted var(--rule); font-size: 1rem; }
.facts dt { color: var(--ink-soft); }
.facts dd { margin: 0; text-align: right; color: var(--ink); font-variant-numeric: lining-nums tabular-nums; }
.facts .sub { color: var(--muted); }
.facts a.ext { color: var(--ink); text-decoration: underline; text-decoration-color: var(--brass); text-underline-offset: 4px; }
.facts a.ext:hover { color: var(--brass); }
.facts .total { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); margin-top: .2rem; }
.facts .total dt, .facts .total dd { font-weight: 500; color: var(--ink); }
.months { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .5rem; }
.months li { display: grid; gap: .35rem; justify-items: center; text-align: center; padding: .7rem .25rem; border: 1px solid var(--rule); }
.months .m { font-family: var(--display); font-size: .78rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.unit-pay { display: grid; gap: .45rem; }
.unit-pay + .unit-pay { margin-top: .6rem; }
.unit-label { font-family: var(--display); font-weight: 600; font-size: 1.05rem; color: var(--ink); }
.chip { font-size: .85rem; padding: .1rem .55rem; border-radius: 999px; white-space: nowrap; }
.chip.paid { color: var(--ok); background: var(--ok-bg); }
.chip.late { color: var(--warn); background: var(--warn-bg); }
.chip.due { color: var(--ink-soft); background: var(--paper-2); }
.chip.unpaid { color: var(--bad); background: var(--bad-bg); font-weight: 500; }

/* Tenant portal */
.tenant-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.5rem 3rem; }
.pay-card { grid-row: span 2; display: grid; gap: .9rem; align-content: start; padding: 1.75rem; background: var(--paper-2); border-top: 1px solid var(--brass); }
.pay-card h3 { font-size: 1.5rem; }

.pay-card .venmo { justify-self: start; margin-top: .4rem; }
.pay-card .handle { font-size: 1rem; color: var(--ink-soft); user-select: all; }
.pay-card .note { font-size: .95rem; color: var(--muted); font-style: italic; }
.tenant .panel p { color: var(--ink-soft); font-size: 1rem; }
.contacts { list-style: none; margin: .4rem 0 0; padding: 0; display: grid; gap: 1rem; }
.contacts li { display: grid; gap: .1rem; font-size: 1rem; }
.contacts strong { font-weight: 500; color: var(--ink); }
.contacts a { color: var(--ink-soft); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; overflow-wrap: anywhere; }
.contacts a:hover { text-decoration-color: var(--brass); }

/* ---------- MP Holdings colour: the logo's navy and gold ---------- */

/* MP Holdings details: suit pinstripes, the logo's house divider, deco corners */
.site-mp .masthead, .site-mp .landing-head, .site-mp footer {
  background-image: repeating-linear-gradient(90deg, rgba(243, 238, 226, .045) 0 1px, transparent 1px 15px);
}
.site-mp .landing-head { background-color: var(--band-2); background-image:
  repeating-linear-gradient(90deg, rgba(243, 238, 226, .045) 0 1px, transparent 1px 15px),
  radial-gradient(ellipse at 50% 120%, rgba(196, 154, 82, .18), transparent 60%),
  linear-gradient(180deg, var(--band-2), var(--band)); }
.site-mp .mp-rule { display: flex; align-items: center; justify-content: center; gap: .9rem; color: var(--gold-btn); margin-top: .6rem; }
.site-mp .mp-rule span { height: 2px; width: min(9rem, 28vw); background: var(--gold-btn); border-radius: 2px; transform-origin: right; animation: rule-in 1.1s .2s cubic-bezier(.2,.7,.2,1) both; }
.site-mp .mp-rule span:last-child { transform-origin: left; }

@keyframes rule-in { from { transform: scaleX(.15); } to { transform: scaleX(1); } }
@keyframes house-in { from { transform: translateY(4px); opacity: .4; } to { transform: none; opacity: 1; } }
.site-mp .entrance { position: relative; transition: transform .3s ease, box-shadow .3s ease, background .25s; }
.site-mp .entrance::before, .site-mp .entrance::after {
  content: ""; position: absolute; width: 26px; height: 26px; border: 0 solid var(--gold-btn); pointer-events: none; transition: width .3s, height .3s;
}

@media (prefers-reduced-motion: reduce) { .site-mp .mp-rule span, .site-mp .mp-rule svg { animation: none; } .site-mp .entrance:hover { transform: none; } }

/* About */

<script>
document.getElementById("year").textContent = new Date().getFullYear();

const COMPANIES = {
  "cadency":     { name: "CADENCY",     title: "Cadency",     logo: '<span class="crest" aria-hidden="true"></span>' },
  "mp-holdings": { name: "MP HOLDINGS", title: "MP Holdings", logo: '<span class="mp-mark" aria-hidden="true"></span>' }
};
// Each sign-in page: which company it belongs to and which encrypted entry it opens.
const ALL_PORTALS = {
  "cadency":   { company: "cadency",     vault: "cadency",     heading: "Executive Login", label: "Executive Portal", perUser: true },
  "mp-owner":  { company: "mp-holdings", vault: "mp-holdings", heading: "Owner Login",     label: "Owner Portal", perUser: true },
  "mp-tenant": { company: "mp-holdings", vault: "mp-tenants",  heading: "Tenant Login",    label: "Tenant Portal", perUser: true }
};
const SITE_TITLE = "MP Holdings";
// Only the sign-in pages this site offers.
const PORTALS = Object.fromEntries(["mp-owner","mp-tenant"].map(id => [id, ALL_PORTALS[id]]));
const ALIASES = { "mp-holdings": "mp-owner" };
const VAULT = JSON.parse(document.getElementById("vault").textContent);
const unlocked = {}; // decrypted portal HTML, kept in memory only

const $ = id => document.getElementById(id);
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");

async function decryptPortal(id, username, password) {
  const portal = PORTALS[id];
  const user = username.trim().toLowerCase();
  let v = VAULT[portal.vault];
  if (portal.perUser) {
    const k = hex(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(portal.vault + "\n" + user)));
    v = v && v[k];
    if (!v) throw new Error("unknown user");
  }
  const secret = new TextEncoder().encode(user + "\n" + password);
  const base = await crypto.subtle.importKey("raw", secret, "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: fromB64(v.salt), iterations: v.iterations, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(v.iv) }, key, fromB64(v.data));
  return new TextDecoder().decode(plain);
}

let current = "home";
function show() {
  let hash = location.hash.slice(1);
  if (ALIASES[hash]) { location.replace("#" + ALIASES[hash]); return; }
  current = (hash === "about" && $("view-about")) || PORTALS[hash] ? hash : "home";
  const isPortal = !!PORTALS[current];
  $("view-home").hidden = current !== "home";
  if ($("view-about")) $("view-about").hidden = current !== "about";
  $("view-company").hidden = !isPortal;
  document.querySelectorAll("nav a").forEach(a => {
    const on = a.dataset.view === current || (isPortal && a.dataset.view === "home");
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });

  if (isPortal) {
    const portal = PORTALS[current], c = COMPANIES[portal.company];
    const open = !!unlocked[current];
    $("login").hidden = open;
    $("portal").hidden = !open;
    if (open) {
      $("portal-logo").innerHTML = c.logo;
      $("portal-name").textContent = c.title;
      $("portal-content").innerHTML = unlocked[current];
      document.title = c.title + " · " + portal.label;
    } else {
      $("login-logo").innerHTML = c.logo;
      $("login-name").textContent = c.name;
      $("login-title").textContent = portal.heading;
      $("login-error").textContent = "";
      $("login-form").reset();
      $("portal-content").innerHTML = "";
      document.title = c.title + " · " + portal.heading;
    }
  } else {
    $("portal-content").innerHTML = "";
    document.title = current === "about" ? SITE_TITLE + " · About Us" : SITE_TITLE;
  }
  window.scrollTo(0, 0);
}

$("login-form").addEventListener("submit", async e => {
  e.preventDefault();
  const id = current, user = $("f-user").value, pass = $("f-pass").value;
  if (!user.trim() || !pass) {
    $("login-error").textContent = "Enter your username and password.";
    (user.trim() ? $("f-pass") : $("f-user")).focus();
    return;
  }
  const btn = $("login-submit");
  btn.disabled = true; btn.textContent = "Signing In…";
  $("login-error").textContent = "";
  try {
    unlocked[id] = await decryptPortal(id, user, pass);
    show();
  } catch {
    $("login-error").textContent = "That username and password don't match. Please try again.";
    $("f-pass").value = "";
    $("f-pass").focus();
  } finally {
    btn.disabled = false; btn.textContent = "Sign In";
  }
});

$("sign-out").addEventListener("click", () => {
  delete unlocked[current];
  location.hash = "";
});

window.addEventListener("hashchange", show);
show();
</script>
</body>
